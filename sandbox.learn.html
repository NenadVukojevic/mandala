<html>
<style>
    body,
    html {
        margin: 20;
        padding: 0;
        overflow: hidden;
        background-color: white;
    }

    canvas {
        display: block;
        margin: 20px;
        border: 1px solid black;
    }
</style>

<body>
    <div style="display: flex; flex-direction: column;">

        <div>
            <input type="range" id="delta" min="1" max="20" value="5">
        </div>
        <div style="display: flex; flex-direction: row;">
            <div>
                <button id="increaseAX">aX+</button>
            </div>
            <div>
                <button id="decreaseAX">aX- </button>
            </div>
            <div>
                <button id="increaseAY">aY+</button>
            </div>
            <div>
                <button id="decreaseAY">aY-</button>
            </div>

        </div>
        <div style="display: flex; flex-direction: row;">
            <div>
                <button id="increaseBX">BX+</button>
            </div>
            <div>
                <button id="decreaseBX">BX- </button>
            </div>
            <div>
                <button id="increaseBY">BY+</button>
            </div>
            <div>
                <button id="decreaseBY">BY-</button>
            </div>

        </div>
        <div>
            <button id="showResult">show</button>
        </div>
        <div>
            <canvas id="myCanvas" width="1200" height="1200"></canvas>
        </div>
    </div>

    <script>

        const aXplus = () => {
            pointA.x += 1;
        }

        const delta = document.getElementById('delta');
        const increaseAX = document.getElementById('increaseAX');
        const decreaseAX = document.getElementById('decreaseAX');
        const increaseAY = document.getElementById('increaseAY');
        const decreaseAY = document.getElementById('decreaseAY');

        const increaseBX = document.getElementById('increaseBX');
        const decreaseBX = document.getElementById('decreaseBX');
        const increaseBY = document.getElementById('increaseBY');
        const decreaseBY = document.getElementById('decreaseBY');

        const showResult = document.getElementById('showResult');

        const canvas = document.getElementById('myCanvas');
        const context = canvas.getContext('2d');

        delta.addEventListener('input', function () {
            deltaR = parseInt(delta.value);
        })

        increaseAX.addEventListener('click', function () {
            pointA.x += deltaR;
            redraw();
        });

        decreaseAX.addEventListener('click', function () {
            pointA.x -= deltaR;
            redraw();
        });

        increaseAY.addEventListener('click', function () {
            pointA.y += deltaR;
            redraw();
        });

        decreaseAY.addEventListener('click', function () {
            pointA.y -= deltaR;
            redraw();
        });


        increaseBX.addEventListener('click', function () {
            pointB.x += deltaR;
            redraw();
        });

        decreaseBX.addEventListener('click', function () {
            pointB.x -= deltaR;
            redraw();
        });

        increaseBY.addEventListener('click', function () {
            pointB.y += deltaR;
            redraw();
        });

        decreaseBY.addEventListener('click', function () {
            pointB.y -= deltaR;
            redraw();
        });

        showResult.addEventListener('click', function () {
            console.log('start', start, 'end', end, 'pointA', pointA, 'pointB', pointB);
        })

        var deltaR = 5;
        var start = { x: 250, y: 400 };
        var end = { x: 300, y: 400 };
        var pointA = { x: 150, y: 200 };
        var pointB = { x: 400, y: 200 };

        function redraw() {
            context.clearRect(0, 0, canvas.width, canvas.height);

            context.beginPath();
            context.arc(pointA.x, pointA.y, 2, 0, 2 * Math.PI); // Red dot radius = 5
            context.fillStyle = 'red';
            context.fill();

            context.beginPath();
            context.arc(pointB.x, pointB.y, 2, 0, 2 * Math.PI); // Red dot radius = 5
            context.fillStyle = 'red';
            context.fill();


            context.beginPath();
            context.moveTo(start.x, start.y); // Start point


            // First curve
            context.bezierCurveTo(pointA.x, pointA.y, pointB.x, pointB.y, end.x, end.y);

            context.closePath();

            // Set fill color and fill the shape
            context.fillStyle = "lightblue";
            context.fill();

            context.stroke();
            context.fill
        }
    </script>
</body>

</html>
